<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singapore Food Map</title>
    <!-- Google Maps JavaScript API -->
    <script>
      window.initGoogleMaps = function() {
        window.dispatchEvent(new CustomEvent('googleMapsLoaded'));
      };
    </script>
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAP_API%&libraries=places&callback=initGoogleMaps&loading=async"
      onerror="window.dispatchEvent(new CustomEvent('googleMapsLoaded', { detail: { error: 'Failed to load Google Maps API.' } }))"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
